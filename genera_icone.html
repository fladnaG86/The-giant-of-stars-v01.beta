<!DOCTYPE html>
<html>
<head><title>Genera Icone</title></head>
<body style='background:#000;color:#fff;font-family:Arial;padding:20px'>
<h2>Crea icone per l'app</h2>
<p>Click destro su ogni immagine e salva come:</p>
<canvas id='c192' width='192' height='192' style='border:1px solid #fff;margin:10px'></canvas>
<p>Salva come: icon-192.png</p>
<canvas id='c512' width='512' height='512' style='border:1px solid #fff;margin:10px'></canvas>
<p>Salva come: icon-512.png</p>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, size, size);
  
  // Navicella stilizzata
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(size/2, size*0.15);
  ctx.lineTo(size*0.3, size*0.7);
  ctx.lineTo(size*0.4, size*0.55);
  ctx.lineTo(size/2, size*0.65);
  ctx.lineTo(size*0.6, size*0.55);
  ctx.lineTo(size*0.7, size*0.7);
  ctx.closePath();
  ctx.fill();
  
  // Motore
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.moveTo(size*0.35, size*0.75);
  ctx.lineTo(size/2, size*0.85);
  ctx.lineTo(size*0.65, size*0.75);
  ctx.closePath();
  ctx.fill();
  
  // Titolo
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (size/12) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('GIGANTE', size/2, size*0.93);
}
drawIcon(document.getElementById('c192'), 192);
drawIcon(document.getElementById('c512'), 512);
</script>
</body>
</html>
